name: kazumi
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.2.11+20211

environment:
  sdk: ">=3.3.4 <4.0.0"
  flutter: 3.44.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  flutter_modular: ^6.3.4
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  dio: ^5.0.0
  cookie_jar: ^4.0.9
  crypto: ^3.0.6
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.3.1

  path_provider: ^2.1.5
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  image: ^4.8.0
  # cached_network_image_ce: ^4.6.4
  card_settings_ui: ^2.0.1

  # fvp: ^0.28.0
  # video_player: ^2.9.1

  flutter_volume_controller: ^2.0.1
  audio_video_progress_bar: ^2.0.2
  audio_service: ^0.18.15
  audio_service_mpris: ^0.2.1
  audio_service_win: ^0.0.3
  audio_session: ^0.2.2
  dynamic_color: ^1.8.1
  provider: ^6.1.2
  flutter_displaymode: ^0.6.0

  url_launcher: ^6.3.0
  window_manager: ^0.5.1
  xpath_selector: ^3.0.2
  xpath_selector_html_parser: ^3.0.1

  canvas_danmaku: ^0.3.1
  webdav_client: ^1.2.2
  tray_manager: ^0.5.0
  dlna_dart: ^0.0.8
  logger: ^2.6.2
  flutter_rating_bar: ^4.0.1
  scrollview_observer: ^1.22.0
  saver_gallery: ^4.1.0
  screen_brightness_android: ^2.1.3
  screen_brightness_ios: ^2.1.2
  screen_brightness_ohos: ^2.1.2
  screen_brightness_platform_interface: ^2.1.0
  synchronized: any
  flutter_svg: ^2.2.3
  antlr4: ^4.13.2
  fl_chart: ^1.1.1
  flutter_foreground_task: ^9.0.0
  skeletonizer: ^2.1.2
  flutter_inappwebview_platform_interface: ^1.3.0+1
  flutter_inappwebview_ios: ^1.1.2
  flutter_inappwebview_macos: ^1.1.2
  flutter_inappwebview_android: ^1.1.3
  upgrader: ^12.3.0
  open_filex: ^4.7.0
  html: any
  material_color_utilities: any
  path: any
  photo_view: ^0.15.0
  image_picker: ^1.2.1
  webview_windows:
    git:
      url: https://github.com/Predidit/flutter-webview-windows.git
      ref: 8e3578e6032c93f1723f58db930d480b7828d796
  desktop_webview_window:
    git:
      url: https://github.com/Predidit/linux_webview_window.git
      ref: b429f8ba6b8a99cd0f7eb5fe8d1621f325635c3d
  # 使用 Predidit/Kazumi 的原版 media_kit / media_kit_video fork（含 enableAndroidSurfaceProducer / adBlocker 等原版播放器逻辑）
  # libmpv 的 .so 由 packages/libs/android/media_kit_libs_android_video 提供（Predidit v1.2.6 构建，libmpv 0.41），
  # 通过下方 dependency_overrides 覆盖 pub.dev 的 media_kit_libs_video（其自带 0.36），见 dependency_overrides 说明。
  media_kit:
    path: ../../packages/media_kit
  media_kit_video:
    path: ../../packages/media_kit_video
  media_kit_libs_video: ^1.0.7

dependency_overrides:
  # Use the matching Predidit Windows libmpv package. Its archive includes
  # render_dxgi.h required by the local media_kit_video renderer.
  media_kit_libs_windows_video:
    path: ../../packages/libs/windows/media_kit_libs_windows_video
  # Use Predidit/Kazumi's embedded media_kit_libs_android_video, which bundles
  # libmpv 0.41 (Predidit/libmpv-android-video-build v1.2.6) instead of the
  # pub.dev 1.3.8 build that ships media-kit's libmpv 0.36 (v1.1.7).
  # 0.41 fixes the Android VO-switch refresh-seek bug that made HLS fMP4 streams
  # start ~20s into the video on Android.
  media_kit_libs_android_video:
    path: ../../packages/libs/android/media_kit_libs_android_video

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  mobx_codegen: ^2.7.5
  hive_ce_generator: ^1.10.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3
  msix: ^3.16.12

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/logo/logo_android.png
  image_path_android: assets/images/logo/logo_android.png
  image_path_ios: assets/images/logo/logo_ios.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/logo/logo_android.png
  adaptive_icon_monochrome: assets/images/logo/logo_android.png
  macos:
    generate: true
    image_path: assets/images/logo/logo_rounded.png
  windows:
    generate: true
    image_path: assets/images/logo/logo_android.png
    icon_size: 256 # min:48, max:256, default: 48

flutter_native_splash:
  android: false
  ios: true
  web: false
  color_ios: "#ffffff"
  color_dark_ios: "#212121"
  image_ios: assets/images/logo/logo_ios.png
  image_dark_ios: assets/images/logo/logo_ios.png

msix_config:
  display_name: AniWorld
  publisher: CN=SignPath Foundation, O=SignPath Foundation, L=Lewes, S=Delaware, C=US
  logo_path: assets/images/logo/logo_rounded.png
  sign_msix: false
  install_certificate: false
  build_windows: false

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/images/
    - assets/plugins/
    - assets/shaders/
    - assets/images/logo/
    - assets/statements/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
  # Public source builds use the platform system font.
