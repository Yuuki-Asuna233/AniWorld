<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/mobile-app.css">
<title>排行榜 - AniWorld</title>
<script src="/js/site-utils.js?v=20261011T043709Z"></script>
<script src="common.js"></script>
<style>
* { margin:0; box-sizing:border-box; }
body { background: #0d1117; color: #c9d1d9; font-family:'Segoe UI','PingFang SC',sans-serif; min-height:100vh; }

.header { background: #161b22; border-bottom:1px solid #30363d; padding:12px 24px; display:flex; align-items:center; gap:20px; position:sticky; top:0; z-index:100; flex-wrap:wrap; }
.header a { color:#e85d04; text-decoration:none; font-weight:700; font-size:20px; }
.header input { flex:1; min-width:200px; padding:10px 16px; border-radius:24px; border:1px solid #30363d; background: #0d1117; color: #c9d1d9; font-size:15px; outline:none; }
.header input:focus { border-color: #e85d04; }
.header nav { display:flex; gap:12px; }
.header nav a { color: #8b949e; text-decoration:none; font-size:14px; padding:6px 12px; border-radius:6px; }
.header nav a.on, .header nav a:hover { color:#e85d04; background: #21262d; }

.container { max-width:1000px; margin:0 auto; padding:32px 24px; }
.page-title { font-size:28px; font-weight:800; margin-bottom:24px; }

.tabs { display:flex; gap:8px; margin-bottom:24px; border-bottom:1px solid #30363d; padding-bottom:12px; }
.tab-btn { background:transparent; border:none; color: #8b949e; padding:8px 20px; border-radius:8px; cursor:pointer; font-size:14px; transition:.2s; }
.tab-btn:hover { color:#e85d04; }
.tab-btn.on { background: #e85d04; color: #fff; }

.rank-list { display:flex; flex-direction:column; gap:12px; }
.rank-item { display:flex; align-items:center; gap:16px; background: #161b22; border:1px solid #30363d; border-radius:12px; padding:14px; transition:.2s; cursor:pointer; color:inherit; }
.rank-item:hover { border-color: #e85d04; background:#1c2128; }
.rank-num { width:40px; text-align:center; font-size:22px; font-weight:800; color:#e85d04; flex-shrink:0; }
.rank-num.top3 { color: #ffb703; }
.rank-poster { width:60px; height:80px; border-radius:8px; object-fit:cover; flex-shrink:0; }
.rank-info { flex:1; min-width:0; }
.rank-title { font-size:16px; font-weight:700; color: #e6edf3; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rank-meta { font-size:13px; color: #8b949e; }
.rank-score { font-size:20px; font-weight:800; color: #ffb703; flex-shrink:0; min-width:60px; text-align:right; }

.loading { text-align:center; padding:60px; color: #8b949e; }
.loading-spinner { width:40px; height:40px; border:3px solid #21262d; border-top:3px solid #e85d04; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px; }
.load-bar-wrap { width:200px; height:4px; background: #21262d; border-radius:2px; margin:12px auto 0; overflow:hidden; }
.load-bar { height:100%; background:linear-gradient(90deg,#e85d04,#fd7e14); border-radius:2px; animation:loadPulse 1.5s ease-in-out infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes loadPulse { 0%{width:0%;margin-left:0} 50%{width:60%;margin-left:20%} 100%{width:0%;margin-left:100%} }
.empty { text-align:center; padding:60px; color: #8b949e; }
.empty-icon { font-size:48px; margin-bottom:12px; }

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background: #e85d04;color: #fff;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:999;animation:slideUp .3s ease;box-shadow: 0 4px 20px rgba(232,93,4,.3)}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>

<div class="header">
  <a href="/">AniWorld</a>
  <input type="text" id="headerSearch" placeholder="搜索动漫..." onkeydown="if(event.key==='Enter')search()">
  <nav>
    <a href="/">首页</a>
    <a href="search_anime.html">搜索</a>
    <a href="calendar.html">更新日历</a>
    <a href="categories.html">全部分类</a>
    <a href="rankings.html" class="on">排行榜</a>
    <a href="my.html">我的</a>
  </nav></div>

<div class="container">
  <div class="page-title">🏆 排行榜</div>

  <div class="tabs">
    <button class="tab-btn on" onclick="switchTab('popular', this)">🔥 人气排行</button>
    <button class="tab-btn" onclick="switchTab('toprated', this)">⭐ 评分最高</button>
    <button class="tab-btn" onclick="switchTab('trending', this)">📈 本周趋势</button>
  </div>

  <div class="rank-list" id="rankList">
    <div class="loading"><div class="loading-spinner"></div>加载中...</div>
  </div>
</div>

<script>
let currentTab = 'popular';

async function loadRankings() {
  const list = document.getElementById('rankList');
  list.innerHTML = '<div class="loading"><div class="loading-spinner"></div>加载中...</div>';

  try {
    const r = await fetch('/api/oi/rankings?type=' + currentTab + '&t=' + Date.now(), { cache: 'no-store' });
    const data = await r.json();

    if (data.results && data.results.length > 0) {
      list.innerHTML = data.results.map((a, i) => {
        const idx = window._animeData.push(a) - 1;
        return `
          <div class="rank-item" onclick="playAnime(window._animeData[${idx}])">
            <div class="rank-num ${i < 3 ? 'top3' : ''}">${i + 1}</div>
            <img src="${a.image || ''}" class="rank-poster" alt="" onerror="this.style.display='none'">
            <div class="rank-info">
              <div class="rank-title">${escapeHtml(a.title)}</div>
              <div class="rank-meta">${a.genres ? a.genres.slice(0, 4).map(g=>escapeHtml(g)).join(' · ') : ''}${a.year ? ' · ' + a.year : ''}</div>
            </div>
            <div class="rank-score">${a.score || '-'}</div>
          </div>
        `;
      }).join('');
    } else {
      list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>暂无数据</div>';
    }
  } catch (e) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>加载失败</div>';
  }
}

function switchTab(type, btn) {
  currentTab = type;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  loadRankings();
}

loadRankings();
</script>

<script src="/js/mobile-app.js" defer></script>
<script src="/js/anime-agent-config.js" defer></script>
<script src="/js/anime-agent-widget.js?v=20261012T085600Z" defer></script>
</body>
</html>
