<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/mobile-app.css">
<title>AniWorld - 动漫世界</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

/* Header */
header{background:#161b22;border-bottom:1px solid #1a1a2e;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.header-inner{max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.logo{font-size:24px;font-weight:800;color:#e85d04;text-decoration:none;white-space:nowrap}
.logo span{color:#fff}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav a{color:#666;text-decoration:none;padding:6px 14px;border-radius:8px;font-size:14px;transition:.2s;white-space:nowrap}
nav a:hover,nav a.active{color:#fff;background:#1a1a2e}
.search-box{flex:1;display:flex;gap:0;max-width:500px;margin-left:auto}
.search-box input{flex:1;background:#151520;border:1px solid #2a2a3e;color:#fff;padding:8px 16px;border-radius:8px 0 0 8px;font-size:14px;outline:none}
.search-box input:focus{border-color:#e85d04}
.search-box button{background:#e85d04;border:none;color:#fff;padding:8px 20px;border-radius:0 8px 8px 0;cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
.search-box button:hover{background:#dc5200}

/* ===== Hero Carousel ===== */
.hero-board{max-width:1400px;margin:24px auto 0;padding:0 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.carousel{position:relative;width:100%;height:420px;overflow:hidden;background:#0d0d15}
.hero-board .carousel{border-radius:8px;border:1px solid #1a1a2e}
.carousel-track{display:flex;height:100%;transition:transform .6s cubic-bezier(.25,.8,.25,1)}
.carousel-slide{flex:0 0 100%;height:100%;position:relative;display:flex;align-items:center;overflow:hidden}
.carousel-slide .slide-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:brightness(.35);transform:scale(1.02)}
.carousel-slide img.slide-bg{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.carousel-slide .slide-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.7) 30%,rgba(0,0,0,0) 70%)}
.carousel-slide .slide-content{position:relative;z-index:2;max-width:600px;padding:0 80px}
.carousel-slide .slide-content .tag{display:inline-block;background:#e85d04;color:#fff;padding:3px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:14px;letter-spacing:1px}
.carousel-slide .slide-content .tag.tag-new{background:#22c55e}
.carousel-slide .slide-content .tag.tag-hot{background:#ef4444}
.carousel-slide .slide-content h2{font-size:36px;font-weight:900;color:#fff;margin-bottom:10px;line-height:1.2;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.carousel-slide .slide-content .sub{font-size:15px;color:#666;margin-bottom:6px;line-height:1.5}
.carousel-slide .slide-content .slide-meta{display:flex;align-items:center;gap:16px;margin-top:16px}
.carousel-slide .slide-content .slide-meta .sm-score{color:#ffb703;font-weight:700;font-size:15px}
.carousel-slide .slide-content .slide-meta .sm-year{color:#8b949e;font-size:13px}
.carousel-slide .slide-content .slide-btn{display:inline-block;margin-top:18px;background:#e85d04;color:#fff;padding:10px 28px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;border:none}
.carousel-slide .slide-content .slide-btn:hover{background:#dc5200;transform:translateY(-1px)}

/* Slide 1 — brand slide */
.carousel-slide.slide-brand{background:linear-gradient(135deg,#0d0d15 0%,#0d1117 50%,#0d0d15 100%)}
.carousel-slide.slide-brand .slide-bg{filter:none;background:radial-gradient(ellipse at 30% 50%,rgba(232,93,4,.08) 0%,transparent 60%),radial-gradient(ellipse at 70% 30%,rgba(100,60,255,.06) 0%,transparent 60%);animation:pulse 8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.carousel-slide.slide-brand .slide-content{max-width:none;text-align:center;padding:0 24px;margin:0 auto}
.carousel-slide.slide-brand .slide-content h2{font-size:48px}
.carousel-slide.slide-brand .slide-content h2 .accent{color:#e85d04}
.carousel-slide.slide-brand .slide-content .sub{font-size:18px;color:#666;margin-bottom:20px}
.carousel-slide.slide-brand .brand-stats{display:flex;justify-content:center;gap:40px}
.carousel-slide.slide-brand .brand-stats .bs-item{text-align:center}
.carousel-slide.slide-brand .brand-stats .bs-num{font-size:28px;font-weight:800;color:#e85d04}
.carousel-slide.slide-brand .brand-stats .bs-lbl{font-size:13px;color:#666;margin-top:4px}

/* Arrows */
.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.25s;backdrop-filter:blur(8px);outline:none}
.carousel-arrow:hover{background:rgba(232,93,4,.3);border-color:#e85d04}
.carousel-arrow.prev{left:20px}
.carousel-arrow.next{right:20px}

/* Dots */
.carousel-dots{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
.carousel-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.08);border:none;cursor:pointer;transition:.3s;padding:0}
.carousel-dot.active{background:#e85d04;width:28px;border-radius:6px}

.hero-side-grid{height:420px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:16px}
.hero-side-card{position:relative;min-width:0;background:#111118;border:1px solid #1a1a2e;border-radius:8px;overflow:hidden;color:inherit;cursor:pointer;transition:.25s;display:flex;flex-direction:column}
.hero-side-card:hover{transform:translateY(-3px);border-color:#e85d04;box-shadow:0 8px 24px rgba(232,93,4,.14)}
.hero-side-card .side-img{position:relative;height:128px;background:#151520;overflow:hidden}
.hero-side-card .side-img img{width:100%;height:100%;object-fit:cover;display:block;transition:.35s}
.hero-side-card:hover .side-img img{transform:scale(1.04)}
.hero-side-card .side-img::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.58) 100%)}
.hero-side-card .side-tag{position:absolute;left:8px;top:8px;z-index:2;background:rgba(232,93,4,.92);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.hero-side-card .side-score{position:absolute;right:8px;bottom:8px;z-index:2;color:#ffb703;font-size:12px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.hero-side-card .side-info{padding:10px 12px;min-height:0;display:flex;flex-direction:column;gap:4px}
.hero-side-card h3{font-size:14px;line-height:1.35;color:#fff;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-side-card .side-meta{font-size:12px;color:#8b949e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-side-empty{height:100%;display:flex;align-items:center;justify-content:center;background:#111118;border:1px solid #1a1a2e;border-radius:8px;color:#666;font-size:14px}

@media(max-width:768px){
  .hero-board{grid-template-columns:1fr;margin-top:16px;padding:0 14px;gap:14px}
  .carousel{height:320px}
  .carousel-slide .slide-content{padding:0 28px;max-width:100%}
  .carousel-slide .slide-content h2{font-size:22px}
  .carousel-slide .slide-content .sub{font-size:13px}
  .carousel-slide .slide-content .slide-btn{padding:8px 20px;font-size:13px}
  .carousel-slide.slide-brand .slide-content h2{font-size:28px}
  .carousel-slide.slide-brand .brand-stats{gap:24px}
  .carousel-slide.slide-brand .brand-stats .bs-num{font-size:22px}
  .carousel-arrow{width:34px;height:34px;font-size:16px}
  .carousel-arrow.prev{left:8px}
  .carousel-arrow.next{right:8px}
  .hero-side-grid{height:auto;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(184px,auto);gap:12px}
  .hero-side-card .side-img{height:112px}
  .hero-side-card .side-info{padding:8px 9px}
  .hero-side-card h3{font-size:13px}
  .hero-side-card .side-meta{font-size:11px}
}

/* Content */
main{max-width:1400px;margin:0 auto;padding:32px 24px}
.section-title{font-size:22px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:4px;height:22px;background:#e85d04;border-radius:2px}
.anime-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin-bottom:40px}
.anime-card{background:#111118;border-radius:12px;overflow:hidden;border:1px solid #1a1a2e;transition:.3s;cursor:pointer;color:inherit}
.anime-card:hover{transform:translateY(-4px);border-color:#e85d04;box-shadow:0 8px 30px rgba(232,93,4,.15)}
.anime-card .img-wrap{position:relative;padding-top:140%;background:#151520;overflow:hidden}
.anime-card .img-wrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transition:.4s}
.anime-card:hover .img-wrap img{transform:scale(1.05)}
.anime-card .img-wrap .score{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.8);color:#ffb703;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:700}
.anime-card .img-wrap .eps{position:absolute;bottom:10px;left:10px;background:rgba(232,93,4,.9);color:#fff;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.anime-card .img-wrap .new-tag{position:absolute;top:10px;left:10px;color:#fff;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.anime-card .info{padding:12px}
.anime-card .info h3{font-size:14px;font-weight:600;margin-bottom:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.anime-card .info .meta{font-size:12px;color:#666}

/* Today Update Section */
.today-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin-bottom:40px}
.today-badge{display:inline-block;background:#22c55e;color:#fff;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-right:6px}
.today-ep{color:#22c55e;font-size:12px}

/* Search Results */
.search-page{padding:0}
.search-page .search-header{background:#0d0d15;border-bottom:1px solid #1a1a2e;padding:20px 24px;position:sticky;top:57px;z-index:50}
.search-page .search-header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px}
.search-page .search-header input{flex:1;max-width:600px;background:#151520;border:1px solid #2a2a3e;color:#fff;padding:10px 16px;border-radius:8px;font-size:16px;outline:none}
.search-page .search-header input:focus{border-color:#e85d04}
.search-page .search-header button{background:#e85d04;border:none;color:#fff;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:16px;font-weight:600;transition:.2s}
.search-page .search-header button:hover{background:#dc5200}
.search-page .result-count{max-width:1400px;margin:0 auto;padding:16px 24px 0;color:#666;font-size:14px}

/* Loading/Empty */
.loading{text-align:center;padding:60px 24px;color:#666}
.loading .spinner{width:40px;height:40px;border:3px solid #1a1a2e;border-top-color:#e85d04;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
.loading .load-bar-wrap{width:200px;height:4px;background:#1a1a2e;border-radius:2px;margin:12px auto 0;overflow:hidden}
.loading .load-bar{height:100%;background:linear-gradient(135deg,#e85d04,#fd7e14);border-radius:2px;animation:loadPulse 1.5s ease-in-out infinite}
@keyframes loadPulse{0%{width:0%;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0%;margin-left:100%}}
.empty{padding:60px 24px;text-align:center;color:#666}
.empty .icon{font-size:48px;margin-bottom:12px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#e85d04;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:999;animation:slideUp .3s ease;box-shadow:0 4px 20px rgba(232,93,4,.3)}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media(max-width:768px){
  .header-inner{flex-wrap:wrap;gap:8px}
  nav{order:3;width:100%}
  .search-box{order:2;max-width:none}
  .anime-grid,.today-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" class="logo">Ani<span>World</span></a>
    <nav>
      <a href="/" id="nav-home" class="active">首页</a>
      <a href="search_anime.html" id="nav-search">搜索</a>
      <a href="calendar.html" id="nav-calendar">更新日历</a>
      <a href="categories.html" id="nav-categories">全部分类</a>

    </nav>
    <div class="search-box">
      <input type="text" id="quickSearch" placeholder="搜索动漫..." onkeydown="if(event.key==='Enter')goSearch()">
      <button onclick="goSearch()">搜索</button>
    </div></div>
</header>

<div id="app"></div>

<script src="/js/site-utils.js?v=20261016-covers-v1"></script>
